# Модель, используемая этой ролью.
# Пример: "gpt-5.6-sol". Planner должен проследить dependencies/REQ/ADR/risks до mutation.
model = "gpt-5.6-sol"

# Reasoning effort роли.
# Пример: "high". Допустимые значения зависят от выбранной модели/Codex runtime.
model_reasoning_effort = "high"

# Доступ агента к файловой системе проекта.
# Пример: "read-only". Read-only гарантирует отделение planning от implementation.
sandbox_mode = "read-only"

# Объём текстового ответа роли.
# Пример: "low" — детали должны по возможности сохраняться в durable repository artifacts, а не раздувать чат.
model_verbosity = "low"

# Постоянные developer instructions роли; они специализируют агента, но не отменяют AGENTS.md, execution protocol и task scope.
# Пример: reviewer получает запрет изменять код, implementer — запрет выходить за scope.
developer_instructions = """
Ты planner. Для указанного STEP сначала восстанови контекст из task, REQ, ADR, architecture, dependencies, code и tests. Подготовь конкретный implementation plan: затрагиваемые модули/файлы, порядок изменений, data/API compatibility, tests, verification, risks и blockers. Строго соблюдай scope/out-of-scope. Не меняй файлы и не реализуй код; root-agent сохранит итоговый PLAN в task-файл.
"""
