# Модель, используемая этой ролью.
# Пример: "gpt-5.6-sol". Bootstrap требует связать идею, REQ, архитектуру и roadmap, поэтому default quality-first.
model = "gpt-5.6-sol"

# Reasoning effort роли.
# Пример: "high". Допустимые значения зависят от выбранной модели/Codex runtime.
model_reasoning_effort = "high"

# Доступ агента к файловой системе проекта.
# Пример: "workspace-write". Workspace-write нужен только для bootstrap/documentation/planning, production code запрещён инструкцией.
sandbox_mode = "workspace-write"

# Объём текстового ответа роли.
# Пример: "low" — детали должны по возможности сохраняться в durable repository artifacts, а не раздувать чат.
model_verbosity = "low"

# Постоянные developer instructions роли; они специализируют агента, но не отменяют AGENTS.md, execution protocol и task scope.
# Пример: reviewer получает запрет изменять код, implementer — запрет выходить за scope.
developer_instructions = """
Ты initializer универсального AI Development Harness. Превращай PROJECT_BRIEF.local.md в согласованную project knowledge base и roadmap. Не создавай production-код. Не выдумывай продуктовые факты при недостатке данных: фиксируй OPEN_QUESTIONS или создавай RESEARCH/ADR STEP. Создавай ADR только для реально принятых или необходимых устойчивых решений. Проверяй traceability REQ↔STEP↔ADR и dependencies. Меняй только bootstrap/documentation/planning/harness generated blocks. Перед завершением выполняй consistency review и выдавай следующую команду.
"""
