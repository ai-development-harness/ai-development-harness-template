# Workflow skills, которые являются частью core Harness protocol и не должны случайно исчезнуть.
# Пример: `run-step` обязателен, даже если конкретный проект чаще использует ручной PLAN/IMPLEMENT/REVIEW.
required_skills = [
  "init-project",
  "add-plan-step",
  "find-skill",
  "install-skill",
  "create-skill",
  "plan-step",
  "implement-step",
  "review-step",
  "fix-step",
  "run-step",
  "audit-step",
  "project-status",
  "next-step",
  "reconcile-project",
  "release-check",
  "requirements-review",
  "architecture-change",
  "documentation-sync",
  "code-review",
  "security-review",
  "write-tests",
  "git-workflow",
  "quick-fix",
  "generate-github-templates",
  "update-harness",
]

# Канонические role identifiers, которые обязаны существовать во всех поддерживаемых runtime adapters.
# Пример: `reviewer` должен иметь и Codex binding, и Claude Code subagent profile.
required_agents = [
  "initializer",
  "architect",
  "planner",
  "implementer",
  "reviewer",
  "security_reviewer",
  "test_reviewer",
  "docs",
  "mechanic",
  "skill_curator",
  "git_operator",
  "harness_updater",
]

# Команды execution/Git surface, которые обязаны оставаться в machine-readable transition graph и canonical docs.
# Maintenance-команды self-update проверяются отдельными update skill/docs и не дублируются в project execution protocol.
# Пример: если при рефакторинге исчезнет `STEP ADD:`, Harness validator должен это заметить.
required_commands = [
  "PROJECT INIT",
  "STEP ADD:",
  "SKILL FIND:",
  "SKILL INSTALL:",
  "SKILL CREATE:",
  "GITHUB GENERATE TEMPLATES",
  "PROJECT QUICK FIX:",
  "STEP PLAN STEP-NNN",
  "STEP IMPLEMENT STEP-NNN",
  "STEP REVIEW STEP-NNN",
  "STEP FIX STEP-NNN",
  "STEP RUN STEP-NNN",
  "STEP AUDIT STEP-NNN",
  "PROJECT STATUS",
  "STEP NEXT",
  "PROJECT RECONCILE",
  "RELEASE CHECK",
  "GIT CHECK",
  "GIT COMMIT",
  "GIT PUSH",
  "GIT PR",
  "GIT SYNC",
]

# Glob-patterns файлов, которые не должны быть tracked Git.
# Пример: local brief, private runtime overrides, `.env`, private keys, dependencies/build/cache/log artifacts.
forbidden_tracked_globs = [
  "PROJECT_BRIEF.local.md",
  "AGENTS.local.md",
  "CLAUDE.local.md",
  ".project/local/**",
  ".codex/local/**",
  ".claude/local/**",
  ".claude/settings.local.json",
  ".env",
  ".env.*",
  "*.pem",
  "*.key",
  "id_rsa",
  "id_ed25519",
  "node_modules/**",
  "dist/**",
  "build/**",
  "coverage/**",
  ".cache/**",
  "__pycache__/**",
  ".venv/**",
  "*.log",
  "*.tmp",
  "*.swp",
]

# Явные исключения из forbidden patterns.
# Пример: `.env.example` разрешён как безопасный документированный шаблон без secrets.
allowed_tracked_globs = [
  ".env.example",
]

# Пути, для которых validator применяет lightweight text-format hygiene checks.
# Пример: trailing whitespace/final newline проверяются в Harness-managed docs/config/tooling, а не автоматически во всём будущем product code.
format_paths = [
  "AGENTS.md",
  "CLAUDE.md",
  "AGENTS.local.example.md",
  "README.md",
  ".project",
  ".codex",
  ".claude",
  "docs/harness",
  "planning/EXECUTION_PROTOCOL.md",
  "planning/README.md",
  "planning/harness-updates",
  "tools/harness",
  ".github",
]

# Config-файлы, где каждый параметр обязан иметь человекочитаемый комментарий и пример рядом с настройкой.
# Пример: YAML/TOML допускают comments; strict JSON Claude settings документируются отдельно в CLAUDE_CODE.md.
documented_config_globs = [
  ".project/*.toml",
  ".project/*.yaml",
  ".codex/*.toml",
  ".codex/agents/*.toml",
  ".github/workflows/*.yml",
  ".github/workflows/*.yaml",
]

# Проверять ли наличие comment block непосредственно перед каждым YAML/TOML параметром.
# Пример: true не позволяет добавить `timeout = 30` без объяснения назначения.
check_config_parameter_comments = true
# Требовать ли в comment block параметра строку `Пример:` или `Example:`.
# Пример: true заставляет показывать допустимый/типичный вариант прямо рядом с настройкой.
check_config_parameter_examples = true

# Максимальный размер одного tracked file до ошибки/предупреждения validator согласно реализации.
# Пример: 10 MB помогает ловить случайно добавленные binaries/artifacts.
max_tracked_file_size_mb = 10
# Проверять ли, что Harness-managed text files декодируются как UTF-8.
# Пример: true.
check_utf8 = true
# Требовать ли финальный newline в проверяемых text files.
# Пример: true улучшает diff/tool compatibility.
check_final_newline = true
# Запрещать ли trailing whitespace в проверяемых text files.
# Пример: true.
check_trailing_whitespace = true
# Проверять ли tracked text files на типичные маркеры приватных ключей.
# Пример: true блокирует случайное добавление PEM/OpenSSH private key material.
check_private_key_material = true
# Искать ли неразрешённые Git merge-conflict markers `<<<<<<<`, `=======`, `>>>>>>>`.
# Пример: true блокирует случайный commit незавершённого conflict resolution.
check_merge_markers = true
