# Deterministic integrity policy, используемая локально GIT COMMIT / GIT PUSH и Harness CI.

# Версия схемы policy-файла.
# Пример: 1; меняется только при несовместимом изменении структуры config.
version = 1

# Файлы, без которых repository больше не считается валидным экземпляром Harness.
# Пример: удаление `planning/EXECUTION_PROTOCOL.md` или runtime adapter должно ломать CI.
required_files = [
  "AGENTS.md",
  ".project/harness-update-graph.json",
  ".project/command-transitions.json",
  "CLAUDE.md",
  "README.md",
  "PROJECT_BRIEF.example.md",
  "AGENTS.local.example.md",
  ".gitignore",
  ".project/manifest.yaml",
  ".project/git-policy.toml",
  ".project/harness-policy.toml",
  ".project/harness-update.toml",
  ".project/harness.lock.json",
  ".codex/config.toml",
  ".codex/agents/harness-updater.toml",
  ".claude/README.md",
  ".claude/settings.json",
  ".claude/agents/harness-updater.md",
  "docs/harness/README.md",
  "docs/harness/COMMANDS.md",
  "docs/harness/COMMAND_SYNTAX.md",
  "docs/harness/COMMAND_TRANSITIONS.md",
  "docs/harness/EXECUTION_STATUS.md",
  "docs/harness/DOCUMENT_MODEL.md",
  "docs/harness/GLOSSARY.md",
  "docs/harness/GIT_WORKFLOW.md",
  "docs/harness/LANGUAGE_POLICY.md",
  "docs/harness/QUICK_CHANGES.md",
  "docs/harness/GITHUB_TEMPLATES.md",
  "docs/harness/UPDATES.md",
  "docs/harness/CLAUDE_CODE.md",
  "planning/EXECUTION_PROTOCOL.md",
  "planning/harness-updates/README.md",
  "planning/tasks/TEMPLATE.md",
  "docs/requirements/SPEC.md",
  "docs/adr/TEMPLATE.md",
  ".github/pull_request_template.md",
  ".github/workflows/harness-integrity.yml",
  "tools/harness/validate.py",
  "tools/harness/command_transitions.py",
  "tools/harness/validate-command.py",
  "tools/harness/execution-state.py",
  "tools/harness/resolve-next-command.py",
  "tools/harness/execution_status.py",
  "tools/harness/execution-self-test.py",
  ".gitmessage",
