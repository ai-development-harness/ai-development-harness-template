# Политика безопасного self-update protocol layer из release-тегов source repository.

[source]
# Канонический source repository Harness в формате owner/repo.
# Пример: "ai-development-harness/ai-development-harness-template".
repository = "ai-development-harness/ai-development-harness-template"

# Ветка, из которой maintainers готовят releases; updater обновляет проекты только по tags, не по moving branch.
# Пример: "main".
default_branch = "main"

# Регулярное выражение release-тегов, допустимых как immutable update baseline.
# Пример: '^v\d+\.\d+\.\d+$'.
tag_pattern = '^v\d+\.\d+\.\d+$'

# Machine-readable граф допустимых переходов. Updater читает его из default_branch только как routing metadata;
# содержимое release по-прежнему берётся исключительно из immutable tags.
# Пример: ".project/harness-update-graph.json".
update_manifest = ".project/harness-update-graph.json"

# Fallback paths для routing manifest при bootstrap relocation. Они читаются только если основной update_manifest отсутствует;
# содержимое по-прежнему считается только routing metadata из configured default_branch.
# Пример: [".harness/harness-update-graph.json"] позволяет bridge release пережить перенос control plane.
update_manifest_fallbacks = [".harness/harness-update-graph.json"]

[state]
# Машинный lock с текущим known BASE проекта.
# Пример: ".project/harness.lock.json".
lock_file = ".project/harness.lock.json"

# Каталог durable report после успешного HARNESS UPDATE APPLY.
# Пример: "planning/harness-updates".
report_directory = "planning/harness-updates"

[bootstrap_relocation]
# Разрешить updater-у безопасный перенос bootstrap/control-plane paths между несовместимыми layout поколениями.
# Пример: true в bridge release; обычные releases могут оставить capability неиспользованной.
enabled = true

# Exact target-policy paths, которые текущий доверенный updater имеет право прочитать из immutable target tag.
# Должен существовать ровно один candidate; несколько найденных policy считаются неоднозначностью и блокируют mutation.
# Пример: old layout использует .project, новый layout — .harness.
target_policy_candidates = [".project/harness-update.toml", ".harness/harness-update.toml"]

# Текущий lock path до relocation; значение должно совпадать с state.lock_file.
# Пример: ".project/harness.lock.json".
lock_from = ".project/harness.lock.json"

# Новый lock path после успешного relocation hop. Destination lock создаётся последним перед retirement старого lock.
# Пример: ".harness/harness.lock.json".
lock_to = ".harness/harness.lock.json"

# Rename-aware relocation Harness-owned paths. Local source обязан совпадать с BASE; destination collision блокирует update.
# Пример: перенос deterministic tooling из tools/harness/** в .harness/tools/**.
harness_owned_moves = [
  { from = ".project/harness-update-graph.json", to = ".harness/harness-update-graph.json" },
  { from = ".project/command-transitions.json", to = ".harness/command-transitions.json" },
  { from = ".project/README.md", to = ".harness/README.md" },
  { from = ".project/harness-policy.toml", to = ".harness/harness-policy.toml" },
  { from = ".project/harness-update.toml", to = ".harness/harness-update.toml" },
  { from = "docs/harness/**", to = ".harness/docs/**" },
  { from = "planning/EXECUTION_PROTOCOL.md", to = ".harness/docs/EXECUTION_PROTOCOL.md" },
  { from = "tools/harness/**", to = ".harness/tools/**" },
]

# Rename-aware relocation shared paths. BASE читается по old path, OURS — из текущего проекта, THEIRS — по new path;
# результат обычного 3-way merge записывается в destination, поэтому project-specific настройки не теряются.
# Пример: project.initialized/language сохраняются при .project/manifest.yaml → .harness/manifest.yaml.
shared_moves = [
  { from = ".project/manifest.yaml", to = ".harness/manifest.yaml" },
  { from = ".project/git-policy.toml", to = ".harness/git-policy.toml" },
]

[ownership]
# Полностью Harness-owned paths. Updater заменяет их только если local content не расходится с BASE;
# при local modification update блокируется вместо silent overwrite.
# Пример: docs/harness/**, core workflow skills и runtime adapter README.
harness_owned = [
  ".project/harness-update-graph.json",
  ".project/command-transitions.json",
  ".agents/skills/**",
  ".codex/README.md",
  ".claude/README.md",
  ".project/README.md",
  ".project/harness-policy.toml",
  ".project/harness-update.toml",
  "docs/harness/**",
  "planning/EXECUTION_PROTOCOL.md",
  "planning/harness-updates/README.md",
  "tools/harness/**",
]

# Shared paths могут содержать project-specific настройки; при расхождении local/base/target применяется 3-way merge.
# Пример: пользователь может менять model/effort в Codex и Claude Code runtime adapters.
shared = [
  ".codex/config.toml",
  ".codex/agents/**",
  "CLAUDE.md",
  ".claude/settings.json",
  ".claude/agents/**",
  ".github/**",
  ".gitignore",
  ".gitmessage",
  ".project/git-policy.toml",
  ".project/manifest.yaml",
  "AGENTS.local.example.md",
  "PROJECT_BRIEF.example.md",
]

# Файлы с generated project blocks. Помимо обычного 3-way merge updater обязан восстановить local marked blocks.
# Пример: README.md сохраняет <!-- PROJECT:START --> ... <!-- PROJECT:END -->.
marker_merge = [
  "AGENTS.md",
  "README.md",
]

[markers."AGENTS.md"]
# Имена generated blocks, которые всегда принадлежат конкретному проекту и сохраняются при update.
# Пример: PROJECT-CONTEXT.
blocks = ["PROJECT-CONTEXT", "SKILL-ROUTING"]

[markers."README.md"]
# Имена generated blocks, которые всегда принадлежат конкретному проекту и сохраняются при update.
# Пример: PROJECT.
blocks = ["PROJECT"]
