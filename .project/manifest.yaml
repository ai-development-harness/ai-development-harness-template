# Machine-readable metadata самого Harness. Product requirements здесь хранить нельзя.
# Пример: секция содержит только version template/protocol layer.
harness:
  # Стабильный номер поколения Harness template.
  # Пример: "1". Пока protocol не стабилизирован dogfooding, номер не повышается за каждую итерацию.
  version: "1"
  # Release Harness, от которого текущий project protocol layer синхронизирован.
  # Пример: "0.2.6"; immutable source ref хранится в `.project/harness.lock.json`.
  release: "0.4.0"

# Состояние конкретного проекта, созданного из template.
# Пример: до INIT initialized=false/name=null, после INIT значения заполняются initializer.
project:
  # Завершён ли одноразовый `PROJECT INIT`.
  # Пример: false в template; initializer меняет на true только после consistency check.
  initialized: false
  # Каноническое короткое имя проекта после INIT.
  # Пример: "acme-billing"; null до инициализации.
  name: null
  # ISO-8601 дата/время успешной инициализации.
  # Пример: "2026-09-15T16:00:00+03:00"; null до INIT.
  initializedAt: null

# Настройки orchestration Harness, которые проект может менять без изменения protocol.
# Пример: лимит FIX ↔ REVIEW задаётся в диапазоне от 1 до 5.
execution:
  # Максимальное число циклов FIX → REVIEW внутри одного STEP RUN STEP до остановки.
  # Допустимый диапазон: от 1 до 5 включительно. Пример: 3.
  maxFixReviewCycles: 3

# Политика дополнительных specialized reviewers поверх обязательного independent review.
# Пример: auto сохраняет risk/diff-based orchestration, always запускает reviewer для каждого review-прохода.
review:
  # Когда запускать security reviewer. Допустимо: auto | always.
  # Пример: auto запускает его только при security-sensitive scope или фактическом security-relevant diff.
  security: auto
  # Когда запускать test reviewer. Допустимо: auto | always.
  # Пример: auto запускает его только при сложной/сомнительной test surface.
  tests: auto

# Project-specific настройки управления repository skills.
# Пример: search.maxResults ограничивает размер выдачи SKILL FIND.
skills:
  # Настройки поиска сторонних/repository skills.
  # Пример: maxResults=5 сохраняет компактный shortlist.
  search:
    # Максимальное число кандидатов, сохраняемых и возвращаемых SKILL FIND.
    # Допустимый диапазон: от 1 до 10 включительно. Пример: 5.
    maxResults: 5

# Единая языковая политика Harness и project tooling. Значения — BCP 47 language tags.
# Пример: `ru`, `en`, `pt-BR`. Отдельные доменные/i18n-тесты могут осознанно использовать другие языки.
language:
  # Базовый fallback, если для конкретного типа текста не задано отдельное значение.
  # Пример: ru.
  default: ru
  # Язык обычных ответов агентов пользователю.
  # Пример: ru; для англоязычной команды можно задать en.
  agentResponses: ru
  # Язык project documentation, REQ, ADR, STEP, review/audit/release reports.
  # Пример: ru.
  documentation: ru
  # Язык автоматически сформированных commit message subject/body.
  # Пример: ru; Conventional Commit type/scope остаются техническими идентификаторами.
  commitMessages: ru
  # Язык комментариев и doc-comments в product code, если комментарий действительно нужен.
  # Пример: ru; имена API, identifiers и термины технологий не переводятся.
  codeComments: ru
  # Язык человекочитаемых названий test cases/spec descriptions.
  # Пример: ru; tests локализации могут намеренно использовать несколько языков.
  testNames: ru
  # Язык человекочитаемого fixture/sample content, когда домен не требует другого.
  # Пример: ru; machine identifiers/keys не локализуются.
  fixtures: ru
  # Язык GitHub issue forms и Pull Request template, генерируемых командой GITHUB GENERATE TEMPLATES.
  # Пример: ru.
  githubTemplates: ru
  # Язык release notes/changelog, если проект их генерирует через Harness.
  # Пример: ru.
  releaseNotes: ru

# Пути к основным источникам project knowledge.
# Пример: requirements указывает на `docs/requirements/SPEC.md`.
sources:
  # Локальный сырой brief пользователя; файл не должен попадать в Git.
  # Пример: PROJECT_BRIEF.local.md.
  localBrief: PROJECT_BRIEF.local.md
  # Нормализованное описание проекта после INIT.
  # Пример: docs/PROJECT.md.
  projectOverview: docs/PROJECT.md
  # Канонический файл product requirements.
  # Пример: docs/requirements/SPEC.md.
  requirements: docs/requirements/SPEC.md
  # Текущий architecture baseline.
  # Пример: docs/architecture.md.
  architecture: docs/architecture.md
  # Roadmap projection всех STEP.
  # Пример: planning/PLAN.md.
  roadmap: planning/PLAN.md
  # Status projection STEP.
  # Пример: planning/STATUS.md.
  status: planning/STATUS.md

# Пути к protocol/planning artifacts Harness.
# Пример: taskDirectory=`planning/tasks`.
protocol:
  # Формальная семантика INIT/ADD/PLAN/IMPLEMENT/REVIEW и других команд.
  # Пример: planning/EXECUTION_PROTOCOL.md.
  file: planning/EXECUTION_PROTOCOL.md
  # Каталог canonical task-файлов STEP-NNN.
  # Пример: planning/tasks.
  taskDirectory: planning/tasks
  # Каталог immutable review reports.
  # Пример: planning/reviews.
  reviewDirectory: planning/reviews
  # Каталог audit/reconcile reports.
  # Пример: planning/audits.
  auditDirectory: planning/audits
  # Каталог durable результатов SKILL FIND.
  # Пример: planning/skill-searches.
  skillSearchDirectory: planning/skill-searches
  # Реестр установленных/созданных дополнительных skills.
  # Пример: docs/skills/REGISTRY.md.
  skillRegistry: docs/skills/REGISTRY.md
  # Каталог durable Harness update reports.
  # Пример: planning/harness-updates.
  harnessUpdateDirectory: planning/harness-updates

# Пути к repository policies и deterministic validation.
# Пример: gitPolicy=`.project/git-policy.toml`.
repository:
  # Настройки GIT COMMIT / GIT PUSH / GIT PR / GIT SYNC и branch policy.
  # Пример: .project/git-policy.toml.
  gitPolicy: .project/git-policy.toml
  # Политика обязательных Harness artifacts/repository hygiene.
  # Пример: .project/harness-policy.toml.
  harnessPolicy: .project/harness-policy.toml
  # Ownership/source policy безопасного self-update.
  # Пример: .project/harness-update.toml.
  harnessUpdatePolicy: .project/harness-update.toml
  # Lock known BASE текущего Harness release.
  # Пример: .project/harness.lock.json.
  harnessLock: .project/harness.lock.json
  # Локальный deterministic validator, используемый GIT COMMIT / GIT PUSH/CI.
  # Пример: tools/harness/validate.py.
  harnessValidation: tools/harness/validate.py
  # Baseline GitHub Actions workflow целостности Harness.
  # Пример: .github/workflows/harness-integrity.yml.
  harnessCI: .github/workflows/harness-integrity.yml
